# ==============================================================================
# High-Availability Load Balanced Stack for NestJS A2Z Store API
# Features:
#   - Replicated auto-scalable instances (replicas: 2+)
#   - Traefik Dynamic Round-Robin Load Balancing with Active Healthchecks
#   - Zero-Downtime Rolling Deployments (start-first)
#   - Shared Persistent Storage for Uploads across all replicas
#   - Resource limits (CPU/Memory) & automatic restart policies
# ==============================================================================

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: a2z-api:latest
    expose:
      - "5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - APP_ENV=production
      - APP_URL=${APP_URL:-https://api.a2zoutletstore.com}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:a2zstore2026a@postgres:5432/a2zstore?schema=public}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - JWT_SECRET=${JWT_SECRET:-ffe7d1856163b3df17e5437920ee10453f5b83d30c62a48a0d5554923d608d6e}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://a2zoutletstore.com,https://www.a2zoutletstore.com,https://admin.a2zoutletstore.com,https://dashboard.a2zoutletstore.com,http://localhost:3000,http://localhost:3001}
      - UDDOKTAPAY_BASE_URL=${UDDOKTAPAY_BASE_URL:-https://sandbox.uddoktapay.com/}
      - UDDOKTAPAY_API_KEY=${UDDOKTAPAY_API_KEY:-982d381360a69d419689740d9f2e26ce36fb7a50}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - default
      - dokploy-network
    deploy:
      mode: replicated
      replicas: 2
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.a2z-api.rule=Host(`nestapi.a2zoutletstore.com`) || Host(`api.a2zoutletstore.com`)"
      - "traefik.http.routers.a2z-api.entrypoints=websecure"
      - "traefik.http.routers.a2z-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.a2z-api.service=a2z-api-svc"
      - "traefik.http.services.a2z-api-svc.loadbalancer.server.port=5001"
      - "traefik.http.services.a2z-api-svc.loadbalancer.passhostheader=true"
      - "traefik.http.services.a2z-api-svc.loadbalancer.healthcheck.path=/"
      - "traefik.http.services.a2z-api-svc.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.a2z-api-svc.loadbalancer.healthcheck.timeout=3s"

volumes:
  uploads_data:
    driver: local

networks:
  default:
    driver: bridge
  dokploy-network:
    external: true
